name: CI

on:
  push:
  pull_request:

jobs:
  tests-e2e:
    name: Tests e2e dbt (seed + build)
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execution du test de bout en bout
        run: ./run_e2e.sh
